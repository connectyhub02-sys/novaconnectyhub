name: connectyhub-managed-portal
x-bounds: &bounds
  restart: "no"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  mem_limit: 128m
  memswap_limit: 128m
  cpus: 0.25
  pids_limit: 64
  network_mode: service:database
  logging:
    driver: json-file
    options: {max-size: "5m", max-file: "2"}
x-node: &node
  <<: *bounds
  image: connectyhub-managed-portal:homolog-20260915
services:
  database:
    <<: *bounds
    network_mode: bridge
    image: postgres:17.11-alpine3.23@sha256:09f3fe6ab613dc2ba3f7584dcebdf4bb7acf98366169cd1805ebf9a65eab1041
    user: "70:70"
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    cpus: 0.50
    shm_size: 32m
    ports: ["127.0.0.1:3126:3126", "127.0.0.1:3128:3082"]
    tmpfs: ["/tmp:size=16m,mode=1777", "/var/run/postgresql:size=8m,uid=70,gid=70,mode=0770"]
    environment:
      POSTGRES_DB: managed_portal
      POSTGRES_PASSWORD_FILE: /run/secrets/database-password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=40, -c, max_wal_size=128MB]
    volumes: ["/opt/connectyhub-managed-portal/data/postgres:/var/lib/postgresql/data", "/opt/connectyhub-managed-portal/secrets/database-password:/run/secrets/database-password:ro"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d managed_portal"]
      interval: 5s
      timeout: 3s
      retries: 15
  auth:
    <<: *bounds
    image: supabase/gotrue:v2.197.0@sha256:839f529492d116b4e8b7777c953a27c381d34c15a744b1bcefde5eefaa1f9f9f
    user: "1000:1000"
    mem_limit: 256m
    memswap_limit: 256m
    env_file: /opt/connectyhub-managed-portal/secrets/auth.env
    environment:
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_API_HOST: 127.0.0.1
      PORT: "9999"
      API_EXTERNAL_URL: https://infraestrutura.connectyhub.com.br
      GOTRUE_SITE_URL: https://infraestrutura.connectyhub.com.br
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_LOG_LEVEL: error
    depends_on:
      database: {condition: service_healthy}
  rest:
    <<: *bounds
    image: postgrest/postgrest:v16.3@sha256:63b567a462c4fd81ede0bdff0b38a150f732ad5fe4f4b01cebeb6a1aa8dbe0d6
    user: "1000:1000"
    env_file: /opt/connectyhub-managed-portal/secrets/rest.env
    environment:
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_POOL: "3"
      PGRST_SERVER_HOST: 127.0.0.1
      PGRST_SERVER_PORT: "3000"
    depends_on:
      database: {condition: service_healthy}
  facade:
    <<: *node
    command: [node, runtime/private-proxy.mjs]
  web:
    <<: *node
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.50
    pids_limit: 128
    tmpfs: ["/tmp:size=32m,uid=1000,gid=1000"]
    env_file: /opt/connectyhub-managed-portal/secrets/web.env
    environment:
      PORT: "3126"
      HOSTNAME: 0.0.0.0
      MANAGED_PROJECTS_ENABLED: "true"
      MANAGED_OBJECT_GATEWAY_URL: http://127.0.0.1:3081
      PORTAL_DATABASE_URL: http://127.0.0.1:8000
      PORTAL_ORIGIN: https://infraestrutura.connectyhub.com.br
      MANAGED_PUBLIC_ORIGIN: https://infraestrutura.connectyhub.com.br
    depends_on: [auth, rest, facade, objects]
  objects:
    <<: *node
    command: [node, managed-objects/main.mjs]
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      MANAGED_OBJECT_BIND: 127.0.0.1
      MANAGED_OBJECT_ROOT: /data/objects
      MANAGED_OBJECT_SECRET_FILE: /run/secrets/object-key
    volumes: ["/opt/connectyhub-managed-portal/data/objects:/data/objects", "/opt/connectyhub-managed-portal/secrets/object-key:/run/secrets/object-key:ro"]
  diagnostic:
    <<: *node
    command: [node, runtime/diagnostic-fleet.mjs]
    volumes: ["/opt/connectyhub-managed-portal/secrets/service-key:/run/secrets/service-key:ro", "/opt/connectyhub-managed-portal/secrets/worker-seed:/run/secrets/worker-seed:ro"]
    depends_on: [rest]
  telemetry:
    <<: *node
    command: [node, worker/telemetry-gateway-main.mjs]
    environment:
      MANAGED_DATABASE_REST_URL: http://127.0.0.1:3000/
      MANAGED_DATABASE_KEY_FILE: /run/secrets/service-key
      MANAGED_TELEMETRY_KEY_FILE: /run/secrets/telemetry-key
      MANAGED_GATEWAY_BIND: 0.0.0.0
    volumes: ["/opt/connectyhub-managed-portal/secrets/service-key:/run/secrets/service-key:ro", "/opt/connectyhub-managed-portal/secrets/telemetry-key:/run/secrets/telemetry-key:ro"]
    depends_on: [rest]
